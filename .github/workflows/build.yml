name: Build Sonora APK

on:
  push:
    branches: [main, master]
    paths:
      - "drop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate newest zip in drop
        id: zip
        run: |
          latest=$(ls -t drop/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No zip file found in drop/"
            exit 1
          fi
          echo "path=$latest" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "${{ steps.zip.outputs.path }}" -d "$RUNNER_TEMP/project"
          settings=$(find "$RUNNER_TEMP/project" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$settings" ]; then
            echo "No Gradle project found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find "$PROJECT_DIR" -path "*outputs/apk/release/*.apk" -exec cp {} "$RUNNER_TEMP/out/Sonora.apk" \;
          ls -l "$RUNNER_TEMP/out"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-apk
          path: ${{ runner.temp }}/out/Sonora.apk
          if-no-files-found: error
