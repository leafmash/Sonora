name: Build Sonora APK

on:
  push:
    branches: [main, master]
    paths:
      - "drop/**"
      - "test/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a draft release from this build"
        type: boolean
        default: false
      notes:
        description: "What's new (shown in the update pop-up). Used only when creating a release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Locate newest zip in drop
        id: zip
        run: |
          latest=$(git log -1 --diff-filter=AM --name-only --format= -- 'drop/*.zip' 'test/*.zip' | head -n 1)
          if [ -z "$latest" ] || [ ! -f "$latest" ]; then
            latest=$(ls drop/*.zip test/*.zip 2>/dev/null | sort | tail -n 1 || true)
          fi
          if [ -z "$latest" ]; then
            echo "No zip file found in drop/ or test/"
            exit 1
          fi
          echo "Zip: $latest"
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          case "$latest" in
            drop/*) echo "channel=drop" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=test" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Read app version
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          version_file="$(dirname "$ZIP_PATH")/version.txt"
          if [ ! -f "$version_file" ]; then
            echo "Missing $version_file. Add a version.txt next to the zip containing a version like 1.2.0"
            exit 1
          fi
          version="$(tr -d '[:space:]' < "$version_file")"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$version' in $version_file. Use the form MAJOR.MINOR.PATCH, for example 1.2.0"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "MINOR and PATCH must be 99 or less"
            exit 1
          fi
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "App version: $version (code $code)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Extract project
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/project"
          settings=$(find "$RUNNER_TEMP/project" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$settings" ]; then
            echo "No Gradle project found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonora.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/sonora.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ACOUSTID_KEY: ${{ secrets.ACOUSTID_KEY }}
          VERSION_NAME: ${{ env.APP_VERSION }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find "$PROJECT_DIR" -path "*outputs/apk/release/*.apk" -exec cp {} "$RUNNER_TEMP/out/Sonora.apk" \;
          cp "$RUNNER_TEMP/out/Sonora.apk" "$RUNNER_TEMP/out/Sonora-$APP_VERSION.apk"
          ls -l "$RUNNER_TEMP/out"

      - name: Create draft release
        if: ${{ (github.event_name == 'push' && steps.zip.outputs.channel == 'drop') || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_NOTES: ${{ inputs.notes }}
        run: |
          NOTES="$DISPATCH_NOTES"
          if [ -z "$NOTES" ] && [ -f drop/notes.txt ]; then
            NOTES="$(cat drop/notes.txt)"
          fi
          NOTES="${NOTES:-Bug fixes and improvements}"
          if gh release view "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release v$APP_VERSION already exists. Increase the number in version.txt"
            exit 1
          fi
          gh release create "v$APP_VERSION" "$RUNNER_TEMP/out/Sonora-$APP_VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora $APP_VERSION" \
            --notes "$NOTES" \
            --draft

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Sonora-${{ env.APP_VERSION }}
          path: ${{ runner.temp }}/out/Sonora-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
