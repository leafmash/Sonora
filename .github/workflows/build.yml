name: Build Sonora APK

on:
  push:
    branches: [main, master]
    paths:
      - "drop/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Also create a draft release from this build"
        type: boolean
        default: false
      notes:
        description: "What's new (shown in the update pop-up). Used only when creating a release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Locate newest zip in drop
        id: zip
        run: |
          latest=$(ls -t drop/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$latest" ]; then
            echo "No zip file found in drop/"
            exit 1
          fi
          name=$(basename "$latest" .zip)
          detected=$(echo "$name" | grep -Eo '[0-9]+(\.[0-9]+)+' | head -n 1 || true)
          if [ -n "$detected" ]; then
            version="$detected"
            found="true"
          else
            version="1.0.0"
            found="false"
          fi
          echo "Zip: $latest"
          echo "App version: $version (found in file name: $found)"
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Extract project
        env:
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/project"
          settings=$(find "$RUNNER_TEMP/project" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$settings" ]; then
            echo "No Gradle project found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sonora.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/sonora.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ACOUSTID_KEY: ${{ secrets.ACOUSTID_KEY }}
          VERSION_NAME: ${{ steps.zip.outputs.version }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find "$PROJECT_DIR" -path "*outputs/apk/release/*.apk" -exec cp {} "$RUNNER_TEMP/out/Sonora.apk" \;
          ls -l "$RUNNER_TEMP/out"

      - name: Create draft release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          FOUND: ${{ steps.zip.outputs.found }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$FOUND" != "true" ]; then
            echo "The zip name has no version, so a release can't be created. Rename it like Sonora-1.1.0.zip"
            exit 1
          fi
          NOTES="${NOTES:-Bug fixes and improvements}"
          cp "$RUNNER_TEMP/out/Sonora.apk" "$RUNNER_TEMP/out/Sonora-$VERSION.apk"
          gh release create "v$VERSION" "$RUNNER_TEMP/out/Sonora-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sonora $VERSION" \
            --notes "$NOTES" \
            --draft

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Sonora-apk
          path: ${{ runner.temp }}/out/Sonora.apk
          if-no-files-found: error
